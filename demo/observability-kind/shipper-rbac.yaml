apiVersion: v1
kind: ServiceAccount
metadata:
  name: jumpstarter-shipper
  namespace: jumpstarter-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jumpstarter-observability-demo-shipper
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jumpstarter-observability-demo-shipper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jumpstarter-observability-demo-shipper
subjects:
  - kind: ServiceAccount
    name: jumpstarter-shipper
    namespace: jumpstarter-lab
