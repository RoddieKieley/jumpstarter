apiVersion: v1
kind: Namespace
metadata:
  name: prometheus-jumpstarter-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: prometheus-jumpstarter-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-jumpstarter-demo
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods", "namespaces", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-jumpstarter-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-jumpstarter-demo
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: prometheus-jumpstarter-demo
---
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: jumpstarter
  namespace: prometheus-jumpstarter-demo
spec:
  serviceAccountName: prometheus
  replicas: 1
  scrapeInterval: 5s
  evaluationInterval: 5s
  retention: 1h
  serviceMonitorSelector:
    matchLabels:
      jumpstarter.dev/metrics: "true"
  serviceMonitorNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: jumpstarter-lab
  podMonitorSelector: {}
  probeSelector: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
