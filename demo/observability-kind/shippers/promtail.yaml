apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: demo-promtail-shipper
  namespace: jumpstarter-lab
spec:
  selector:
    matchLabels:
      app: demo-promtail-shipper
  template:
    metadata:
      labels:
        app: demo-promtail-shipper
    spec:
      serviceAccountName: jumpstarter-shipper
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: promtail
          image: grafana/promtail:3.6.0
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/promtail/promtail.yaml
            - -config.expand-env
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
              readOnly: true
            - name: data
              mountPath: /var/lib/promtail
            - name: positions
              mountPath: /run/promtail
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: jumpstarter-log-shipper
            items:
              - key: promtail.yaml
                path: promtail.yaml
        - name: data
          emptyDir: {}
        - name: positions
          emptyDir: {}
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
