apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: demo-vector-shipper
  namespace: jumpstarter-lab
spec:
  selector:
    matchLabels:
      app: demo-vector-shipper
  template:
    metadata:
      labels:
        app: demo-vector-shipper
    spec:
      serviceAccountName: jumpstarter-shipper
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vector
          image: timberio/vector:0.61.0-debian
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/vector/vector.yaml
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
            - name: data
              mountPath: /var/lib/vector
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: jumpstarter-log-shipper
            items:
              - key: vector.yaml
                path: vector.yaml
        - name: data
          emptyDir: {}
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
